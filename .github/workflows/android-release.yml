name: Android Release Build

# Builds a SIGNED release APK and AAB on every push and on demand. The keystore
# never lives in the repo: it comes from a base64 GitHub Secret, is decoded at
# build time, used to sign in release mode, and deleted before the job ends.
# Secrets are passed only through the environment and never printed.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, then build signed APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the game is tested with locally. Bump it on
          # purpose (and match android/ to that Flutter's template) rather than
          # letting a newer release break the build.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (engine, every night winnable, progress, screens)
        run: flutter test

      - name: Decode keystore from GitHub Secrets
        env:
          COASTLIGHT_KEYSTORE_BASE64: ${{ secrets.COASTLIGHT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$COASTLIGHT_KEYSTORE_BASE64" ]; then
            echo "::error::COASTLIGHT_KEYSTORE_BASE64 secret is not set. Add the four signing secrets before releasing."
            exit 1
          fi
          printf '%s' "$COASTLIGHT_KEYSTORE_BASE64" | base64 --decode > android/app/keeper-release.jks

      - name: Write key.properties from GitHub Secrets
        env:
          COASTLIGHT_KEYSTORE_PASSWORD: ${{ secrets.COASTLIGHT_KEYSTORE_PASSWORD }}
          COASTLIGHT_KEY_PASSWORD: ${{ secrets.COASTLIGHT_KEY_PASSWORD }}
          COASTLIGHT_KEY_ALIAS: ${{ secrets.COASTLIGHT_KEY_ALIAS }}
        run: |
          # storeFile is resolved by Gradle relative to the app module dir.
          {
            echo "storeFile=keeper-release.jks"
            echo "storePassword=${COASTLIGHT_KEYSTORE_PASSWORD}"
            echo "keyPassword=${COASTLIGHT_KEY_PASSWORD}"
            echo "keyAlias=${COASTLIGHT_KEY_ALIAS}"
          } > android/key.properties

      - name: Build signed APK (release)
        run: flutter build apk --release

      - name: Build signed AAB (release)
        run: flutter build appbundle --release

      - name: Remove signing material
        if: always()
        run: rm -f android/app/keeper-release.jks android/key.properties

      - name: Report sizes
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: keeper-of-the-cove-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: keeper-of-the-cove-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
